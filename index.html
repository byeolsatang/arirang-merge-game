<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17111f" />
  <title>ARIRANG Merge Game</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="title-block">
        <p class="eyebrow" id="theme-kicker">ARIRANG MERGE GAME</p>
        <h1 id="theme-title">ARIRANG Merge Game</h1>
        <p id="theme-description" class="theme-description">Theme-driven merge game.</p>
      </div>
    </header>

    <section id="game-shell" class="game-shell">
      <div class="game-hud" aria-label="game controls">
        <div class="hud-panel hud-panel-left">
          <div class="scorebox">
            <span>SCORE</span>
            <strong id="score">0</strong>
          </div>

          <div class="hud-divider" aria-hidden="true"></div>

          <div class="next">
            <span>NEXT</span>
            <div id="next-preview" class="next-preview"></div>
          </div>
        </div>

        <div class="hud-panel hud-panel-right">
          <select id="theme-select" aria-label="テーマを選ぶ"></select>
          <div class="hud-divider" aria-hidden="true"></div>
          <button id="sound-toggle" type="button" aria-label="sound toggle">🔊</button>
        </div>
      </div>

      <div id="drop-line" class="drop-line"></div>
      <div id="effect-layer" class="effect-layer" aria-hidden="true"></div>
      <canvas id="game-canvas"></canvas>

      <div id="gameover" class="gameover" hidden>
        <p>GAME OVER</p>
        <strong id="final-score">0</strong>
        <button id="restart" type="button">もう一度</button>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script type="module" src="./src/game.js"></script>
</body>
</html>
