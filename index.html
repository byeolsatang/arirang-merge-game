<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#17111f" />
  <title>ARIRANG Merge Game</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow" id="theme-kicker">ARIRANG MERGE GAME</p>
        <h1 id="theme-title">ARIRANG Merge Game</h1>
      </div>
      <div class="scorebox">
        <span>SCORE</span>
        <strong id="score">0</strong>
      </div>
    </header>

    <section class="statusbar">
      <div class="next">
        <span>NEXT</span>
        <div id="next-preview" class="next-preview"></div>
      </div>
      <p id="theme-description">Theme-driven merge game.</p>
      <button id="sound-toggle" type="button" aria-label="sound toggle">🔊</button>
    </section>

    <section id="game-shell" class="game-shell">
      <div id="drop-line" class="drop-line"></div>
      <div id="effect-layer" class="effect-layer" aria-hidden="true"></div>
      <canvas id="game-canvas"></canvas>
      <div id="gameover" class="gameover" hidden>
        <p>GAME OVER</p>
        <strong id="final-score">0</strong>
        <button id="restart" type="button">もう一度</button>
      </div>
    </section>

    <footer>
      <p>Theme config: <code>themes/arirang-base.js</code></p>
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/matter-js@0.20.0/build/matter.min.js"></script>
  <script type="module" src="./src/game.js"></script>
</body>
</html>
